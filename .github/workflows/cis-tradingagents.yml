name: CIS TradingAgents Remote Runner

on:
  push:
    paths:
      - "runtime/tradingagents/request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cis-tradingagents-remote
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout CIS repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install current TradingAgents upstream
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          rm -rf /tmp/TradingAgents
          git clone --depth 1 https://github.com/TauricResearch/TradingAgents.git /tmp/TradingAgents
          echo "TRADINGAGENTS_UPSTREAM_SHA=$(git -C /tmp/TradingAgents rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m pip install /tmp/TradingAgents

      - name: Prepare zero-secret Ollama backend when requested
        shell: bash
        run: |
          set -euo pipefail
          BACKEND=$(python -c 'import json; print(json.load(open("runtime/tradingagents/request.json")).get("backend", "ollama"))')
          if [ "$BACKEND" != "ollama" ]; then
            echo "Cloud/OpenAI-compatible backend requested; skipping Ollama setup."
            exit 0
          fi

          curl -fsSL https://ollama.com/install.sh | sh
          (nohup ollama serve >/tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

          DEEP_MODEL=$(python -c 'import json; r=json.load(open("runtime/tradingagents/request.json")); print(r.get("deep_model") or "qwen3:4b")')
          QUICK_MODEL=$(python -c 'import json; r=json.load(open("runtime/tradingagents/request.json")); print(r.get("quick_model") or r.get("deep_model") or "qwen3:4b")')
          ollama pull "$DEEP_MODEL"
          if [ "$QUICK_MODEL" != "$DEEP_MODEL" ]; then
            ollama pull "$QUICK_MODEL"
          fi
          ollama list

      - name: Run TradingAgents remote engine
        id: tradingagents
        continue-on-error: true
        env:
          TRADINGAGENTS_API_KEY: ${{ secrets.TRADINGAGENTS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python plugins/chen-investment-system/skills/cis/scripts/run_tradingagents_remote.py \
            runtime/tradingagents/request.json \
            runtime/tradingagents/result.json \
            runtime/tradingagents/result.md

      - name: Commit result back to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/tradingagents
          if [ ! -f runtime/tradingagents/result.json ]; then
            printf '%s\n' '{"status":"error","runtime_readiness":"remote_limited","error":"runner produced no result file"}' > runtime/tradingagents/result.json
          fi
          if [ ! -f runtime/tradingagents/result.md ]; then
            printf '%s\n' '# TradingAgents Remote Result' '' 'Runner produced no Markdown report. See result.json.' > runtime/tradingagents/result.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/tradingagents/result.json runtime/tradingagents/result.md
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "chore: store TradingAgents remote result"
            git push origin HEAD:main
          fi

      - name: Surface TradingAgents failure
        if: steps.tradingagents.outcome != 'success'
        run: |
          echo "TradingAgents execution failed; result.json contains the diagnostic."
          exit 1
