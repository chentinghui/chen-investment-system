name: CIS Validate

on:
  push:
    paths:
      - "plugins/chen-investment-system/**"
      - "extensions/research_tooling/**"
      - "integrations/lean/**"
      - ".github/workflows/cis-validate.yml"
      - ".github/workflows/cis-lean-qqq-engine-test.yml"
      - ".github/workflows/cis-tradingagents.yml"
      - "runtime/tradingagents/upstream-status.json"
      - "README.md"
      - "AGENT_ARCHITECTURE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate CIS architecture and contracts
        run: |
          python plugins/chen-investment-system/skills/cis/scripts/validate_cis.py

      - name: Compile CIS Core
        run: |
          python -m py_compile \
            plugins/chen-investment-system/skills/cis/scripts/route_cis.py \
            plugins/chen-investment-system/skills/cis/scripts/score_cis.py \
            plugins/chen-investment-system/skills/cis/scripts/analyze_etf_premium.py \
            plugins/chen-investment-system/skills/cis/scripts/classify_market_regime.py \
            plugins/chen-investment-system/skills/cis/scripts/tactical_setup_gate.py \
            plugins/chen-investment-system/skills/cis/scripts/check_tradingagents_upstream.py \
            plugins/chen-investment-system/skills/cis/scripts/run_tradingagents.py \
            plugins/chen-investment-system/skills/cis/scripts/run_tradingagents_remote.py \
            plugins/chen-investment-system/skills/cis/scripts/validate_cis.py

      - name: Compile LEAN Integration
        run: |
          python -m py_compile \
            integrations/lean/cis_lean_adapter.py \
            integrations/lean/test_cis_lean_adapter.py \
            integrations/lean/strategies/qqq_sma20_50/strategy_logic.py \
            integrations/lean/strategies/qqq_sma20_50/test_strategy_logic.py

      - name: Compile Optional Research Tooling
        run: |
          python -m py_compile \
            extensions/research_tooling/quant_factor_engine.py \
            extensions/research_tooling/backtest_factor_strategy.py \
            extensions/research_tooling/prediction_ledger.py \
            extensions/research_tooling/record_cis_research.py \
            extensions/research_tooling/settle_due_predictions.py \
            extensions/research_tooling/evaluate_cis_predictions.py

      - name: Run CIS Core unit tests
        run: |
          python -m unittest discover \
            -s plugins/chen-investment-system/skills/cis/scripts \
            -p "test_*.py" \
            -v

      - name: Run LEAN Integration unit tests
        run: |
          python -m unittest discover \
            -s integrations/lean \
            -p "test_*.py" \
            -v

      - name: Run LEAN strategy logic unit tests
        run: |
          cd integrations/lean/strategies/qqq_sma20_50
          python -m unittest -v test_strategy_logic.py

      - name: Run Optional Research Tooling unit tests
        run: |
          python -m unittest discover \
            -s extensions/research_tooling \
            -p "test_*.py" \
            -v
